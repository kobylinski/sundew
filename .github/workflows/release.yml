name: Release image
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test without publishing (must be true)
        type: boolean
        required: true
        default: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
      BUILDER: sundew-release-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check repository settings and dispatch mode
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          for setting in DOCKERHUB_IMAGE DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
            if [[ -z ${!setting} ]]; then
              echo "::error::Missing repository setting: $setting"
              exit 1
            fi
          done
          if [[ ! $DOCKERHUB_IMAGE =~ ^[a-z0-9][a-z0-9_-]*/[a-z0-9][a-z0-9._-]*$ ]]; then
            echo '::error::DOCKERHUB_IMAGE must be a Docker Hub namespace/repository without a registry or tag'
            exit 1
          fi
          if [[ $EVENT == workflow_dispatch && $DRY_RUN != true ]]; then
            echo '::error::Manual dispatch requires dry_run=true; only version-tag pushes publish'
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Resolve version and tags
        id: metadata
        run: |
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            scripts/release-tags.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-tags"
          else
            printf 'dev\n' > "$RUNNER_TEMP/release-tags"
          fi
          read -r version < "$RUNNER_TEMP/release-tags"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - run: go vet ./...
      - run: go test -race ./...
      - run: scripts/test-release-tags.sh
      - name: Accept the release image (linux/amd64)
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          SUNDEW_TEST_LANE: release
        run: scripts/acceptance.sh
      - name: Create builder
        run: docker buildx create --name "$BUILDER" --driver docker-container --use --bootstrap
      - name: Build both platforms before publication
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          CREATED: ${{ steps.metadata.outputs.created }}
        run: |
          docker buildx build --builder "$BUILDER" \
            --platform linux/amd64,linux/arm64 --build-arg "VERSION=$VERSION" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label 'org.opencontainers.image.licenses=MIT' \
            --label "org.opencontainers.image.created=$CREATED" \
            --output "type=oci,dest=$RUNNER_TEMP/sundew.oci.tar" .
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Publish both platforms
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          CREATED: ${{ steps.metadata.outputs.created }}
        run: |
          tags=()
          while IFS= read -r tag; do
            tags+=(--tag "$DOCKERHUB_IMAGE:$tag")
          done < "$RUNNER_TEMP/release-tags"
          docker buildx build --builder "$BUILDER" \
            --platform linux/amd64,linux/arm64 --build-arg "VERSION=$VERSION" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label 'org.opencontainers.image.licenses=MIT' \
            --label "org.opencontainers.image.created=$CREATED" \
            "${tags[@]}" --push .
      - name: Clean up builder and login
        if: always()
        run: |
          docker buildx rm "$BUILDER" || true
          docker logout
